server:
  port: 8083

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/bookloop_media_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: Ijse@1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  cloud:
    gcp:
      credentials:
        location: classpath:gcp-key.json
      project-id: project-fb5ef45c-cd3d-4991-92d


gcp:
  bucket:
    name: bookloop-media-bucket

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

