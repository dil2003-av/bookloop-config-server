server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/bookloop_user_db?createDatabaseIfNotExist=true
    username: root
    password: Ijse@1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
